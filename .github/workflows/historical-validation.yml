name: Legacy historical validation (use V3.8 workflows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Migration notice
        run: |
          {
            echo '### This V3.7 workflow is retired'
            echo
            echo 'No provider call was executed.'
            echo 'Use **Estimate historical sample** first, then **Run historical sample** with the exact REQ identifier.'
          } >> "$GITHUB_STEP_SUMMARY"
