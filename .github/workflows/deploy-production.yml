name: Deploy production

on:
  workflow_dispatch:
    inputs:
      deploy_web:
        description: Deploy the web service
        required: true
        type: boolean
        default: true
      deploy_cron:
        description: Deploy the zero-credit daily product cron service
        required: true
        type: boolean
        default: true
      verify_browser:
        description: Run the authenticated Chromium smoke test
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-change
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      RAILWAY_WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE || 'sportpredictionlab' }}
      RAILWAY_CRON_SERVICE_ID: ${{ vars.RAILWAY_CRON_SERVICE_ID }}
      APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
      EXPECTED_VERSION: '4.5.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required configuration
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${RAILWAY_TOKEN:-}" ] || missing+=(RAILWAY_TOKEN)
          [ -n "${RAILWAY_PROJECT_ID:-}" ] || missing+=(RAILWAY_PROJECT_ID)
          [ -n "${APP_PUBLIC_URL:-}" ] || missing+=(APP_PUBLIC_URL)
          if [ '${{ inputs.deploy_cron }}' = 'true' ] && [ -z "${RAILWAY_CRON_SERVICE_ID:-}" ]; then
            missing+=(RAILWAY_CRON_SERVICE_ID)
          fi
          if [ '${{ inputs.verify_browser }}' = 'true' ] && [ -z "${APP_PASSWORD:-}" ]; then
            missing+=(APP_PASSWORD)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '### Deployment blocked\n\nMissing GitHub configuration: `%s`\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Generate packaged release proof
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -m scripts.generate_release_manifest
          python -m scripts.export_handoff

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Queue web deployment without log streaming
        if: ${{ inputs.deploy_web }}
        shell: bash
        run: |
          set -euo pipefail
          railway up --detach --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WEB_SERVICE" --message "Sports Prediction Lab ${GITHUB_SHA}"

      - name: Queue daily product cron deployment without log streaming
        if: ${{ inputs.deploy_cron }}
        shell: bash
        run: |
          set -euo pipefail
          railway up --detach --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_CRON_SERVICE_ID" --message "Sports Prediction Lab ${GITHUB_SHA}"

      - name: Verify production release
        shell: bash
        run: |
          set -euo pipefail
          MODEL_SHA=$(python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('artifacts/release_manifest.json').read_text(encoding='utf-8'))
          print(payload['football_model']['artifact_sha256'] or '')
          PY
          )
          python -m scripts.post_deploy_verify \
            --base-url "$APP_PUBLIC_URL" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-commit "$GITHUB_SHA" \
            --expected-model-sha256 "$MODEL_SHA" \
            --attempts 30 --delay-seconds 10

      - name: Install Chromium smoke-test dependencies
        if: ${{ inputs.verify_browser }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run authenticated browser smoke test
        if: ${{ inputs.verify_browser }}
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python -m scripts.browser_smoke_test --base-url "$APP_PUBLIC_URL" --expected-version "$EXPECTED_VERSION"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Sports Prediction Lab production deployment'
            echo
            echo "- Expected version: \`${EXPECTED_VERSION}\`"
            echo "- Expected commit: \`${GITHUB_SHA}\`"
            echo "- Web requested: \`${{ inputs.deploy_web }}\`"
            echo "- Cron requested: \`${{ inputs.deploy_cron }}\`"
            echo "- Cron service ID configured: \`$([ -n "${RAILWAY_CRON_SERVICE_ID:-}" ] && echo yes || echo no)\`"
            echo "- Browser verification requested: \`${{ inputs.verify_browser }}\`"
            echo "- Public proof endpoint: \`${APP_PUBLIC_URL}/api/release\`"
          } >> "$GITHUB_STEP_SUMMARY"
