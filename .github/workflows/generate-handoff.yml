name: Generate handoff package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate release manifest and handoff ZIP
        run: |
          python -m scripts.generate_release_manifest
          python -m scripts.build_handoff_bundle --output dist/sports-prediction-handoff-v4.0.zip

      - name: Upload handoff artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sports-prediction-handoff-v4.0
          path: dist/sports-prediction-handoff-v4.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo '### Handoff package ready'
            echo
            echo 'Download **sports-prediction-handoff-v4.0** from the Artifacts section of this workflow run.'
            echo 'The bundle is designed to be attached directly to a new conversation and contains no environment variables or secrets.'
          } >> "$GITHUB_STEP_SUMMARY"
