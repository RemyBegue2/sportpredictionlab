name: Rebuild fresh football model

on:
  workflow_dispatch:
  schedule:
    - cron: "35 4 * * 1"

permissions:
  contents: write

concurrency:
  group: fresh-football-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download, train and conditionally promote
        run: python -m scripts.rebuild_fresh_football --download --promote

      - name: Run tests
        run: pytest -q

      - name: Generate release evidence and handoff
        run: |
          python -m scripts.generate_release_manifest
          python -m scripts.export_handoff

      - name: Commit generated model and reports
        id: generated_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sports-prediction-bot"
          git config user.email "sports-prediction-bot@users.noreply.github.com"
          git add -A artifacts/ data/real/ handoff/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes"
          else
            git commit -m "chore: refresh Premier League model candidate"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check Railway deployment credentials
        id: railway_deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        shell: bash
        run: |
          if [ -n "${RAILWAY_TOKEN:-}" ] && [ -n "${RAILWAY_PROJECT_ID:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Railway auto-deploy is not configured. Tests and model rebuild succeeded; use Railway > Deploy Latest Commit."
          fi

      - name: Install Railway CLI
        if: steps.railway_deploy.outputs.enabled == 'true'
        run: npm install --global @railway/cli

      - name: Deploy current code and model to Railway
        if: steps.railway_deploy.outputs.enabled == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
          RAILWAY_WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE || 'sportpredictionlab' }}
          RAILWAY_CRON_SERVICE: ${{ vars.RAILWAY_CRON_SERVICE || 'shadow-cron' }}
        shell: bash
        run: |
          set -euo pipefail
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WEB_SERVICE" \
            --detach \
            --message "Sports Prediction Lab ${{ steps.generated_commit.outputs.head_sha }}"

          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_CRON_SERVICE" \
            --detach \
            --message "Sports Prediction Lab ${{ steps.generated_commit.outputs.head_sha }}"

      - name: Verify deployed release evidence
        if: steps.railway_deploy.outputs.enabled == 'true' && vars.APP_PUBLIC_URL != ''
        env:
          APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
          EXPECTED_COMMIT: ${{ steps.generated_commit.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          MODEL_SHA=$(python - <<'PYCODE'
          import json
          from pathlib import Path
          payload=json.loads(Path('artifacts/release_manifest.json').read_text())
          print(payload['football_model']['artifact_sha256'] or '')
          PYCODE
          )
          python -m scripts.post_deploy_verify             --base-url "$APP_PUBLIC_URL"             --expected-version "3.6.0"             --expected-commit "$EXPECTED_COMMIT"             --expected-model-sha256 "$MODEL_SHA"

