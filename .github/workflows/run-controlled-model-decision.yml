name: Run controlled model decision

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_CONTROLLED_MODEL_DECISION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-model-decision
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_VERSION: '4.9.0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Require exact confirmation
        run: |
          test "${{ inputs.confirmation }}" = "RUN_CONTROLLED_MODEL_DECISION"
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Run bounded decision round
        run: python -m scripts.run_controlled_model_decision --output artifacts/controlled_model_decision_v4_9.json
      - name: Verify zero-credit invariants
        run: |
          python - <<'PY'
          import json
          report=json.load(open('artifacts/controlled_model_decision_v4_9.json', encoding='utf-8'))
          assert report['limits']['provider_credits_consumed'] == 0
          assert report['limits']['automatic_promotion'] is False
          assert report['limits']['maximum_football_challengers'] == 2
          assert len(report['football']['challengers']) <= 2
          assert report['football']['promotion_ready'] is False
          PY
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-model-decision-v4-9
          path: artifacts/controlled_model_decision_v4_9.json
          if-no-files-found: error
          retention-days: 30
