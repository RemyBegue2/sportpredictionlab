name: Run historical sample

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date YYYY-MM-DD
        required: true
        type: string
      end_date:
        description: End date YYYY-MM-DD (long ranges are sampled within the call cap)
        required: true
        type: string
      sample_events:
        description: Event cap (1 to 30)
        required: true
        type: number
        default: 30
      max_discovery_calls:
        description: Discovery snapshots spread across the requested range (1 to 31)
        required: true
        type: number
        default: 14
      max_odds_credits:
        description: Global provider credit cap (10 to 200)
        required: true
        type: number
        default: 120
      confirmation:
        description: Type EXECUTE_SAMPLE
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-change
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      RAILWAY_WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE || 'sportpredictionlab' }}
      APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}
      EXPECTED_VERSION: '4.2.0'
      INPUT_START_DATE: ${{ inputs.start_date }}
      INPUT_END_DATE: ${{ inputs.end_date }}
      INPUT_SAMPLE_EVENTS: ${{ inputs.sample_events }}
      INPUT_MAX_DISCOVERY_CALLS: ${{ inputs.max_discovery_calls }}
      INPUT_MAX_ODDS_CREDITS: ${{ inputs.max_odds_credits }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate complete cloud configuration
        shell: bash
        run: |
          set -euo pipefail

          errors=()

          NORMALIZED_CONFIRMATION=$(printf '%s' "${INPUT_CONFIRMATION:-}" | tr -d '\r\n' | xargs)
          if [ "$NORMALIZED_CONFIRMATION" != 'EXECUTE_SAMPLE' ]; then
            errors+=("confirmation must equal EXECUTE_SAMPLE")
          fi
          [ -n "${THE_ODDS_API_KEY:-}" ] || errors+=("missing repository secret: THE_ODDS_API_KEY")
          [ -n "${RAILWAY_TOKEN:-}" ] || errors+=("missing repository secret: RAILWAY_TOKEN")
          [ -n "${RAILWAY_PROJECT_ID:-}" ] || errors+=("missing repository secret: RAILWAY_PROJECT_ID")
          [ -n "${APP_PUBLIC_URL:-}" ] || errors+=("missing repository variable: APP_PUBLIC_URL")

          if [ ${#errors[@]} -gt 0 ]; then
            {
              echo '### Historical sample blocked: complete configuration required'
              echo
              for error in "${errors[@]}"; do
                echo "- $error"
              done
              echo
              echo 'Create the listed secrets under: Settings → Secrets and variables → Actions → Secrets.'
              echo 'Create APP_PUBLIC_URL under the Variables tab.'
            } >> "$GITHUB_STEP_SUMMARY"

            printf 'Configuration errors:\n'
            printf ' - %s\n' "${errors[@]}"
            exit 2
          fi

          echo 'All required historical-sample configuration is present. The sample runs file-only and does not need DATABASE_URL.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the zero-credit execution plan
        id: request_plan
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.estimate_historical_sample \
            --start "$INPUT_START_DATE" \
            --end "$INPUT_END_DATE" \
            --sample-events "$INPUT_SAMPLE_EVENTS" \
            --max-discovery-calls "$INPUT_MAX_DISCOVERY_CALLS" \
            --max-odds-credits "$INPUT_MAX_ODDS_CREDITS"
          PLAN_ID=$(python -c "import json; print(json.load(open('artifacts/historical_sample_request.json'))['plan_request_id'])")
          echo "plan_id=$PLAN_ID" >> "$GITHUB_OUTPUT"
          {
            echo '### Approved execution plan'
            echo
            echo "- Internal plan ID: \`$PLAN_ID\`"
            echo "- Date range: \`$INPUT_START_DATE → $INPUT_END_DATE\`"
            echo "- Requested events: \`$INPUT_SAMPLE_EVENTS\`"
            echo "- Discovery-call cap: \`$INPUT_MAX_DISCOVERY_CALLS\`"
            echo "- Global provider credit cap: \`$INPUT_MAX_ODDS_CREDITS\`"
            echo '- Storage: GitHub workflow files; PostgreSQL is not required for this sample.'
            echo '- No manual plan identifier is required or compared.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Discover provider events within the global credit cap
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.discover_historical_events \
            --sport-key soccer_epl \
            --start "$INPUT_START_DATE" \
            --end "$INPUT_END_DATE" \
            --max-calls "$INPUT_MAX_DISCOVERY_CALLS" \
            --max-credits "$INPUT_MAX_ODDS_CREDITS" \
            --output data/odds_api/historical/events.csv \
            --execute
          USED=$(python -c "import json; print(int(json.load(open('data/odds_api/historical/event_discovery_state.json'))['consumed_credits']))")
          REMAINING=$(( $INPUT_MAX_ODDS_CREDITS - USED ))
          if [ "$REMAINING" -lt 1 ]; then
            echo "Discovery consumed the complete credit cap ($USED/$INPUT_MAX_ODDS_CREDITS)."
            exit 4
          fi
          echo "consumed_credits=$USED" >> "$GITHUB_OUTPUT"
          echo "remaining_credits=$REMAINING" >> "$GITHUB_OUTPUT"
      - name: Verify file-only planner revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/plan_historical_backfill.py").read_text(encoding="utf-8")
          forbidden = ["init_database", "create_backfill_job", "CloudSettings"]
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(
                  "The file-only planner is not installed at the repository root; "
                  f"old database planner tokens remain: {found}"
              )
          required = ["from sports_predictor.version import APP_VERSION", '"version": APP_VERSION']
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(
                  "V4.2 planner markers are missing. Replace the root-level "
                  f"scripts/plan_historical_backfill.py file: {missing}"
              )
          print("Planner verified: V4.2 file-only with explicit selection funnel.")
          PY
      - name: Build immutable budget-adapted provider plan
        run: |
          python -m scripts.plan_historical_backfill \
            --events-csv data/odds_api/historical/events.csv \
            --horizons 1 \
            --no-closing \
            --bookmakers winamax_fr betclic_fr unibet_fr pmu_fr pinnacle \
            --max-credits '${{ steps.discovery.outputs.remaining_credits }}' \
            --sample-events "$INPUT_SAMPLE_EVENTS" \
            --plan-request-json artifacts/historical_sample_request.json \
            --output-dir data/odds_api/backfill
      - name: Execute immutable file-only sample
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_historical_backfill \
            --plan-dir data/odds_api/backfill \
            --max-credits '${{ steps.discovery.outputs.remaining_credits }}' \
            --storage files \
            --execute
      - name: Prepare leakage-safe model and market comparison
        id: prepare_benchmark
        shell: bash
        run: |
          set +e
          python -m scripts.prepare_market_benchmark \
            --results-csv data/real/football_active.csv \
            --events-csv data/odds_api/historical/events.csv \
            --odds-csv data/odds_api/backfill/historical_odds_long.csv \
            --stage t-1h \
            --output-dir data/benchmark
          PREPARE_CODE=$?
          if [ -s data/benchmark/evaluation_t-1h.csv ]; then
            python -m scripts.run_market_benchmark \
              --input data/benchmark/evaluation_t-1h.csv \
              --minimum-predictions 1000 \
              --exploratory-predictions 100 \
              --minimum-train 30 \
              --folds 5 \
              --output artifacts/market_benchmark_v3_9.json
            BENCHMARK_CODE=$?
          else
            BENCHMARK_CODE=4
          fi
          set -e
          echo "prepare_code=$PREPARE_CODE" >> "$GITHUB_OUTPUT"
          echo "benchmark_code=$BENCHMARK_CODE" >> "$GITHUB_OUTPUT"

      - name: Build quality and evidence report
        id: quality
        shell: bash
        run: |
          set +e
          python -m scripts.build_evidence_report \
            --matches-csv data/benchmark/event_mapping.csv \
            --benchmark-json artifacts/market_benchmark_v3_9.json
          CODE=$?
          set -e
          ACCEPTED=$(python -c "import json; print(str(json.load(open('artifacts/evidence_report_v3_9.json'))['quality_gate']['accepted']).lower())")
          STATUS=$(python -c "import json; print(json.load(open('artifacts/evidence_report_v3_9.json'))['quality_gate']['status'])")
          echo "accepted=$ACCEPTED" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "report_exit_code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Export readable funnel tables
        run: |
          python -m scripts.export_evidence_tables \
            --report artifacts/evidence_report_v3_9.json \
            --events-output artifacts/event_outcomes_v3_9.csv \
            --bookmakers-output artifacts/bookmaker_coverage_v3_9.csv
      - name: Commit evidence report
        id: evidence_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sports-prediction-bot'
          git config user.email 'sports-prediction-bot@users.noreply.github.com'
          git add artifacts/evidence_report_v3_9.json artifacts/event_outcomes_v3_9.csv artifacts/bookmaker_coverage_v3_9.csv
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore: publish V3.9 coverage funnel'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate release proof for the evidence commit
        env:
          SOURCE_COMMIT: ${{ steps.evidence_commit.outputs.head_sha }}
        run: python -m scripts.generate_release_manifest
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy evidence dashboard to Railway
        run: |
          railway up --detach --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WEB_SERVICE" --message "V3.9 evidence ${{ steps.evidence_commit.outputs.head_sha }}"
      - name: Verify deployed release
        shell: bash
        run: |
          MODEL_SHA=$(python -c "import json; print(json.load(open('artifacts/release_manifest.json'))['football_model']['artifact_sha256'] or '')")
          python -m scripts.post_deploy_verify \
            --base-url "$APP_PUBLIC_URL" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-commit '${{ steps.evidence_commit.outputs.head_sha }}' \
            --expected-model-sha256 "$MODEL_SHA" \
            --attempts 30 --delay-seconds 10
      - name: Upload complete sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-sample-evidence-${{ github.run_id }}
          path: |
            artifacts/historical_sample_request.json
            artifacts/evidence_report_v3_9.json
            artifacts/event_outcomes_v3_9.csv
            artifacts/bookmaker_coverage_v3_9.csv
            artifacts/market_benchmark_v3_9.json
            data/benchmark/event_mapping.csv
            data/benchmark/evaluation_t-1h.csv
            data/benchmark/preparation_report.json
            data/odds_api/historical/event_discovery_plan.json
            data/odds_api/historical/event_discovery_state.json
            data/odds_api/historical/events.csv
            data/odds_api/backfill/plan.json
            data/odds_api/backfill/state.json
            data/odds_api/backfill/requests.csv
            data/odds_api/backfill/targets.csv
            data/odds_api/backfill/event_selection.csv
            data/odds_api/backfill/historical_odds_long.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo '### V3.9 historical sample'
            echo
            echo "- Internal request plan: \`${{ steps.request_plan.outputs.plan_id }}\`"
            echo "- Quality status: \`${{ steps.quality.outputs.status }}\`"
            echo "- Quality accepted: \`${{ steps.quality.outputs.accepted }}\`"
            echo "- Discovery credits: \`${{ steps.discovery.outputs.consumed_credits }}\`"
            echo "- Remaining odds cap: \`${{ steps.discovery.outputs.remaining_credits }}\`"
            echo "- Evidence commit: \`${{ steps.evidence_commit.outputs.head_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/evidence_report_v3_9.json ]; then
            echo "- Historical rows: \`$(jq -r '.counts.historical_odds_rows // 0' artifacts/evidence_report_v3_9.json)\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Accepted rows: \`$(jq -r '.counts.accepted_rows // 0' artifacts/evidence_report_v3_9.json)\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Temporal violations: \`$(jq -r '.counts.quarantined_temporal_rows // 0' artifacts/evidence_report_v3_9.json)\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Provider target coverage: \`$(jq -r '((.rates.event_coverage // 0) * 100 | tostring) + "%"' artifacts/evidence_report_v3_9.json)\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Winamax coverage: \`$(jq -r '((.rates.winamax_coverage // 0) * 100 | tostring) + "%"' artifacts/evidence_report_v3_9.json)\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record non-passing data-quality verdict
        if: ${{ steps.quality.outputs.accepted != 'true' }}
        shell: bash
        run: |
          echo '::warning::The cloud run completed and published its evidence report, but the data-quality verdict is blocked.'
          {
            echo
            echo '#### Data-quality verdict'
            echo
            echo 'The technical workflow completed. The evidence is **not approved for model-performance conclusions**.'
            echo 'This analytical verdict does not turn a completed collection into an infrastructure failure.'
          } >> "$GITHUB_STEP_SUMMARY"
