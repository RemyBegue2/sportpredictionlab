services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sports_prediction
      POSTGRES_USER: sports_prediction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_prediction -d sports_prediction"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    ports:
      - "8000:8000"
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_AUTH_REQUIRED: "true"
      APP_COOKIE_SECURE: "false"
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?Set APP_SESSION_SECRET}
      DATABASE_URL: postgresql+psycopg://sports_prediction:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/sports_prediction
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
      THE_ODDS_API_CACHE: /tmp/odds_api_cache
      ODDS_SYNC_SPORTS: soccer_epl
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
