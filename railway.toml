[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["python scripts/db_migrate.py"]
startCommand = "sh -c 'uvicorn webapp:app --host 0.0.0.0 --port ${PORT:-8000} --no-server-header'"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
overlapSeconds = 20
drainingSeconds = 10
