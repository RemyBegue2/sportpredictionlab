services:
  - type: web
    name: sports-prediction-web
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c 'uvicorn webapp:app --host 0.0.0.0 --port ${PORT:-10000} --no-server-header'
    preDeployCommand: python -m scripts.db_migrate
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_AUTH_REQUIRED
        value: "true"
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: THE_ODDS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sports-prediction-db
          property: connectionString
      - key: ODDS_SYNC_SPORTS
        value: soccer_epl
      - key: ODDS_STALE_MINUTES
        value: "15"
      - key: MODEL_VERSION
        value: "4.4.0"
      - key: SHADOW_MODE_ENABLED
        value: "false"
      - key: SHADOW_QUOTA_FLOOR
        value: "100"
      - key: MODEL_MAX_AGE_DAYS
        value: "365"
      - key: DAILY_ODDS_ENABLED
        value: "false"
      - key: DAILY_ODDS_MAX_CREDITS
        value: "0"
      - key: HISTORICAL_EVIDENCE_ENABLED
        value: "false"
      - key: DAILY_FIXTURE_HORIZON_DAYS
        value: "31"

  - type: cron
    name: sports-prediction-daily-product
    runtime: docker
    plan: starter
    region: frankfurt
    schedule: "0 */6 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m scripts.sync_daily_predictions --horizon-days 31
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_AUTH_REQUIRED
        value: "false"
      - key: THE_ODDS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sports-prediction-db
          property: connectionString
      - key: ODDS_SYNC_SPORTS
        value: soccer_epl
      - key: MODEL_VERSION
        value: "4.4.0"
      - key: SHADOW_MODE_ENABLED
        value: "false"
      - key: SHADOW_QUOTA_FLOOR
        value: "100"
      - key: MODEL_MAX_AGE_DAYS
        value: "365"
      - key: DAILY_ODDS_ENABLED
        value: "false"
      - key: DAILY_ODDS_MAX_CREDITS
        value: "0"
      - key: HISTORICAL_EVIDENCE_ENABLED
        value: "false"
      - key: DAILY_FIXTURE_HORIZON_DAYS
        value: "31"

databases:
  - name: sports-prediction-db
    plan: basic-256mb
    region: frankfurt
    databaseName: sports_prediction
    user: sports_prediction
    ipAllowList: []
