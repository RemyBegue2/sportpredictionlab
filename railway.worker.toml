[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Configure BACKFILL_PLAN_DIR and BACKFILL_MAX_CREDITS. Full plans also require BACKFILL_APPROVE_PLAN.
startCommand = "sh -lc 'cd /app && PYTHONPATH=/app python -m scripts.run_historical_backfill --plan-dir ${BACKFILL_PLAN_DIR:-data/odds_api/backfill} --max-credits ${BACKFILL_MAX_CREDITS:-0} --approve-plan ${BACKFILL_APPROVE_PLAN:-} --execute'"
restartPolicyType = "NEVER"
